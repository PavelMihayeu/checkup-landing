<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar Icon</title>
<style>
  .calendar {
    width: 110px;
    height: 100px; /* now square */
    background-color: #ff2f55; /* pink frame */
    border-radius: 16px; /* slightly larger for better proportions */
    display: flex;
    justify-content: center;
    align-items: flex-end;
    box-sizing: border-box;

    /* Simulate border thickness with padding */
    padding: 0 10px 10px 10px; /* equal sides & bottom */
    padding-top: 24px; /* thicker top border */
  }

  .calendar-inner {
    background-color: white;
    width: 100%;
    height: 100%;
    border-radius: 10px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 6px;
    padding: 8px;
    box-sizing: border-box;
  }

  .dot {
    background-color: #ff2f55;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    margin: auto;
  }
</style>
</head>
<body>
  <div class="calendar">
    <div class="calendar-inner">
      <!-- 12 cells, first and last empty -->
      <div></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div></div>
    </div>
  </div>
</body>
</html>
